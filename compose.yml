name: notes-api

services:
  app:
    build:
      context: .
      dockerfile: dockerfile
      target: development
    image: notes-api:development
    env_file: [.env]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PRESENTATION_PROTOCOL: ${PRESENTATION_PROTOCOL:-both}
      DATABASE_ENGINE: ${DATABASE_ENGINE:-sqlite}
      DATABASE_URL: ${DATABASE_URL:-./data/notes.db}
      PORT_HTTP: 3000
      PORT_GRAPHQL: 4000
    ports:
      - '${PORT_HTTP:-3000}:3000'
      - '${PORT_GRAPHQL:-4000}:4000'
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./docker:/app/docker
      - ./tsconfig.json:/app/tsconfig.json
      - ./tsconfig.build.json:/app/tsconfig.build.json
      - ./vitest.config.ts:/app/vitest.config.ts
      - ./vitest.setup.ts:/app/vitest.setup.ts

      - sqlite-data:/app/data

      - /app/node_modules
    init: true
    stdin_open: true
    tty: true
    restart: unless-stopped

  # (postgres y mongo igual que antes)
  postgres:
    image: postgres:16-alpine
    profiles: ['postgres']
    environment:
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: notes
      POSTGRES_DB: notes
    ports: ['5432:5432']
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U notes']
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:7
    profiles: ['mongo']
    ports: ['27017:27017']
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sqlite-data:
  pg-data:
  mongo-data:
  node-modules:
